# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: zaid2314
# "service" is the name of this project. This will also be added to your AWS resource names.
service: authService

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    CLIENT_ID: ${ssm:/CLIENT_ID}
  iamRoleStatements:
    - Effect: 'Allow'
      Action:
        - dynamodb:PutItem
      Resource:
        - arn:aws:dynamodb:ap-south-1:552072248049:table/Users

  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Users # name of the table where users will be stored
        BillingMode: PAY_PER_REQUEST # Automatically scales read/write capacity base on usage
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S # S here means string
        KeySchema:
          - AttributeName: userId
            KeyType: HASH # It indicates the partition key

functions:
  signUp:
    handler: handlers/signUp.signUp
    events:
      -  httpApi:
           path: /sign-up
           method: post
  confirmSignUp:
    handler: handlers/confirmSignUp.confirmSignUp
    events:
      -  httpApi:
           path: /confirm-sign-up
           method: post
  signIn:
    handler: handlers/signIn.signIn
    events:
      -  httpApi:
            path: /sign-in
            method: post
  signOut:
    handler: handlers/signOut.signOut
    events:
      -  httpApi:
            path: /sign-out
            method: post
