org: zaid2314
service: bannerService

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-south-1
  environment:
    BUCKET_NAME: banner-images-ads-mohammad-zaid-dev-2314-new
    DYNAMODB_TABLE: Banners
  iamRoleStatements:
    - Effect: Allow
      Action:
        - s3:PutObject
      Resource:
        - arn:aws:s3:::banner-images-ads-mohammad-zaid-dev-2314-new/*
    - Effect: Allow
      Action:
        - dynamodb:PutItem
        - dynamodb:Scan
      Resource:
        - arn:aws:dynamodb:ap-south-1:552072248049:table/Banners

resources:
  Resources:
    BannerImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: banner-images-ads-mohammad-zaid-dev-2314-new
    BannersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Banners
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: fileName
            AttributeType: S
        KeySchema:
          - AttributeName: fileName
            KeyType: HASH

functions:
  uploadBanner:
    handler: handlers/uploadBanners.getUploadUrl
    events:
      - httpApi:
          path: /upload-banner
          method: post

  confirmUpload:
    handler: handlers/confirmUpload.confirmUpload
    events:
      - s3:
          bucket: banner-images-ads-mohammad-zaid-dev-2314-new
          event: s3:ObjectCreated:Put
          existing: true
  getAllBanners:
    handler: handlers/getAllBanners.getAllBanners
    events:
      -  httpApi:
           path: /ads
           method: get